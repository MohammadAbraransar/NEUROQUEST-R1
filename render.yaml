services:
  - type: web
    name: neuroquest
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TEAM
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: neuroquest-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
